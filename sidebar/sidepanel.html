<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNN Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body class="theme-auto">

  <!-- Header -->
  <header class="sp-header">
    <div class="sp-header-left">
      <button class="sp-text-btn" id="new-chat-btn">New</button>
      <button class="sp-text-btn" id="history-btn">History</button>
      <span class="sp-tab-domain" id="tab-domain" title="Active tab"></span>
    </div>
    <div class="sp-header-right">
      <button class="sp-text-btn" id="model-settings-btn">Settings</button>
    </div>
  </header>

  <!-- Selection Preview Bar -->
  <div class="sp-selection-bar" id="selection-bar" style="display:none">
    <span class="sp-selection-label">Selection:</span>
    <span class="sp-selection-text" id="selection-text"></span>
    <button class="sp-selection-clear" id="clear-selection" title="Clear selection">&times;</button>
  </div>

  <!-- Chat Messages -->
  <main class="sp-chat" id="chat-messages">
    <div class="sp-welcome" id="welcome-screen">
      <h2>SNN Chat</h2>
      <p>Ask anything about this page or start a conversation.</p>
      <span class="sp-welcome-model" id="current-model">Loading...</span>
    </div>
  </main>

  <!-- Smart Prompts / Quick Actions -->
  <div class="sp-prompts" id="smart-prompts" style="display:none">
    <div class="sp-prompts-header">
      <span class="sp-prompts-title">Quick Actions</span>
    </div>
    <div class="sp-prompts-grid" id="prompts-grid"></div>
  </div>

  <!-- Context Indicator (shows what context will be attached to next message) -->
  <div class="sp-input-context" id="input-context-indicator" style="display:none">
    <span class="sp-input-context-icon"></span>
    <span class="sp-input-context-text" id="input-context-text"></span>
    <button class="sp-input-context-dismiss" id="dismiss-input-context" title="Don't attach context">&times;</button>
  </div>

  <!-- Input Area -->
  <footer class="sp-input-area">
    <div class="sp-input-row">
      <div class="sp-input-actions">
        <button id="clear-context-btn" title="Clear chat">Clear</button>
        <button id="settings-btn" title="Settings">Settings</button>
      </div>
      <div id="token-counter" class="sp-token-counter" style="display:none">0 tokens</div>
    </div>
    <div class="sp-input-wrapper">
      <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
      <button id="voice-btn" class="sp-voice-btn" title="Voice input">Voice</button>
      <button id="send-btn" class="sp-send-btn">Send</button>
    </div>
  </footer>

  <!-- Settings Overlay -->
  <div class="sp-overlay" id="settings-overlay">
    <div class="sp-overlay-panel">
      <div class="sp-overlay-header">
        <h3>Settings</h3>
        <button class="sp-overlay-close" id="close-settings">&times;</button>
      </div>
      <div class="sp-overlay-body" id="settings-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- History Overlay -->
  <div class="sp-overlay" id="history-overlay">
    <div class="sp-overlay-panel">
      <div class="sp-overlay-header">
        <h3>Chat History</h3>
        <button class="sp-overlay-close" id="close-history">&times;</button>
      </div>
      <div class="sp-overlay-body" id="history-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <script src="../assets/lib/marked.umd.js"></script>
  <script src="../assets/lib/mermaid.min.js"></script>
  <script src="agent-loop.js"></script>
  <script src="agent-ui.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
