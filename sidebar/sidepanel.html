<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNN Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
</head>
<body class="theme-auto">

  <!-- Header -->
  <header class="sp-header">
    <div class="sp-header-left">
      <button class="sp-text-btn" id="new-chat-btn">New</button>
      <button class="sp-text-btn" id="history-btn">History</button>
    </div>
    <div class="sp-header-center">
      <span class="sp-tab-domain" id="tab-domain" title="Active tab"></span>
    </div>
    <div class="sp-header-right">
      <button class="sp-icon-btn sp-lock-btn" id="chat-lock-btn" title="Session Lock: When enabled, your chat session is shared across all tabs."><i class="fas fa-lock-open"></i></button>
      <button class="sp-text-btn" id="model-settings-btn">Settings</button>
    </div>
  </header>

  <!-- Chat Messages -->
  <main class="sp-chat" id="chat-messages">
    <div class="sp-welcome" id="welcome-screen">
      <h2>SNN Chat</h2>
      <p>Ask anything about this page or start a conversation.</p>
      <span class="sp-welcome-model" id="current-model">Loading...</span>
      <div class="sp-model-info-tags" id="model-info-tags"></div>
    </div>
  </main>

  <!-- Context Indicator (shows what context will be attached to next message) -->
  <div class="sp-input-context" id="input-context-indicator" style="display:none">
    <span class="sp-input-context-icon"></span>
    <span class="sp-input-context-text" id="input-context-text"></span>
    <button class="sp-input-context-dismiss" id="dismiss-input-context" title="Don't attach context">&times;</button>
  </div>

  <!-- Input Area -->
  <footer class="sp-input-area">
    <div class="sp-input-row">
      <div class="sp-input-row-left">
        <!-- Model Quick Switch — change model for this session (locked after 1st msg) -->
        <div class="sp-model-quick-switch" id="model-quick-switch">
          <button class="sp-mqs-trigger" id="mqs-trigger" title="Change model for this session">
            <span id="mqs-current-model">Model</span>
            <span class="sp-mqs-caret">▾</span>
          </button>
          <div class="sp-mqs-popover" id="mqs-popover" style="display:none">
            <div class="sp-mqs-search-wrap">
              <svg class="sp-mqs-search-icon" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              <input type="text" class="sp-mqs-search" id="mqs-search" placeholder="Search models…" autocomplete="off">
            </div>
            <div class="sp-mqs-list" id="mqs-list"></div>
          </div>
        </div>
        <div class="sp-quick-actions" id="quick-actions">
          <button class="sp-qa-trigger" id="qa-trigger" title="Quick Actions">
            <span>Quick Actions</span>
            <span class="sp-qa-caret">▾</span>
          </button>
          <div class="sp-qa-popover" id="qa-popover" style="display:none">
            <div class="sp-qa-list" id="qa-list"></div>
          </div>
        </div>
      </div>
      <div class="sp-input-row-right">
        <div id="token-counter" class="sp-token-counter" style="display:none">0 tokens</div>
      </div>
    </div>
    <div class="sp-attach-bar" id="attach-bar" style="display:none"></div>
    <div class="sp-input-wrapper">
      <button id="attach-btn" class="sp-attach-btn" title="Attach file (image, audio, video, PDF, or text)">+</button>
      <input type="file" id="attach-input" accept="image/*,audio/*,video/*,.pdf,.txt,.md,.csv,.json,.log,.html,.htm,.xml,.js,.ts,.css,.py,.rb,.go,.rs,.java,.c,.cpp,.h,.yml,.yaml" multiple hidden>
      <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
      <button id="voice-btn" class="sp-voice-btn" title="Voice input">Voice</button>
      <button id="send-btn" class="sp-send-btn">Send</button>
    </div>
  </footer>

  <!-- Settings Overlay -->
  <div class="sp-overlay" id="settings-overlay">
    <div class="sp-overlay-panel">
      <div class="sp-overlay-header">
        <h3>Settings</h3>
        <button class="sp-overlay-close" id="close-settings">&times;</button>
      </div>
      <div class="sp-overlay-body" id="settings-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- History Overlay -->
  <div class="sp-overlay" id="history-overlay">
    <div class="sp-overlay-panel">
      <div class="sp-overlay-header">
        <h3>Chat History</h3>
        <button class="sp-overlay-close" id="close-history">&times;</button>
      </div>
      <div class="sp-overlay-body" id="history-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- marked stays eager: every rendered message needs it.
       mermaid (3.5MB) is loaded on demand by _loadMermaid() in sidepanel.js —
       only the first message that actually contains a diagram pays for it. -->
  <script src="../assets/lib/marked.umd.js"></script>
  <script src="agent-loop.js"></script>
  <script src="agent-ui.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
